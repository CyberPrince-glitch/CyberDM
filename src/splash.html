<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 35%, #102b32 0%, #08131c 55%, #05090d 100%);
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-app-region: drag;
            user-select: none;
        }

        /* Animated background glow */
        .bg-glow {
            position: fixed;
            width: 420px;
            height: 280px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .3;
            pointer-events: none;
        }

        .bg-glow.cyan {
            background: rgba(0, 210, 255, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .bg-glow.purple {
            background: rgba(120, 0, 255, 0.1);
            top: 30%;
            left: 30%;
            transform: translate(-50%, -50%);
        }

        /* Logo container */
        .logo-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Logo ring animation */
        .logo-ring {
            position: relative;
            width: 112px;
            height: 112px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #00d2ff,
                #2dd9b4,
                #00d2ff,
                #2dd9b4,
                #00d2ff
            );
            opacity: .85;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .logo-ring::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: #070d1a;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: scale(0.5);
            animation: logoReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.28));
        }

        @keyframes logoReveal {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* App name */
        .app-name {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #58f1d0, #5aaaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textReveal 0.4s ease-out 0.15s both;
            text-transform: uppercase;
        }

        @keyframes textReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-tagline {
            font-size: 10px;
            color: rgba(116, 224, 212, 0.65);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0;
            animation: textReveal 0.4s ease-out 0.25s both;
        }

        /* Loading bar */
        .loading-container {
            margin-top: 22px;
            width: 180px;
            opacity: 0;
            animation: textReveal 0.4s ease-out 0.35s both;
        }

        .loading-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .loading-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            border-radius: 3px;
            animation: loadProgress 0.9s ease-out 0.2s forwards;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.36);
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            20% { width: 25%; }
            50% { width: 55%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }

        .loading-text {
            text-align: center;
            margin-top: 8px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* Developer credit — positioned clearly below loading */
        .developer {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            animation: textReveal 0.4s ease-out 0.45s both;
            z-index: 2;
            white-space: nowrap;
        }

        .dev-label {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .dev-name {
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #58f1d0, #5aaaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .version {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.12);
            margin-top: 3px;
            letter-spacing: 1px;
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(0, 210, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-glow cyan"></div>
    <div class="bg-glow purple"></div>

    <!-- Main content -->
    <div class="logo-container">
        <div class="logo-ring">
            <img src="../assets/icon.png" class="logo-img" alt="CyberDM" onerror="this.style.display='none'">
        </div>
        <div class="app-name">CyberDM</div>
        <div class="app-tagline">Free Download Manager</div>

        <div class="loading-container">
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
            <div class="loading-text">INITIALIZING</div>
        </div>
    </div>

    <!-- Developer credit — separate fixed section, won't overlap -->
    <div class="developer">
        <div class="dev-label">Developed by</div>
        <div class="dev-name">Cyber Prince</div>
        <div class="version">v1.0.3</div>
    </div>

</body>
</html>
