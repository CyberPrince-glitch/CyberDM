<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Import URLs</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="main.css" rel="stylesheet">
</head>
<body class="p-3">
    <h5 class="mb-3">Paste URLs (one per line) or load from a file</h5>
    <textarea id="urlList" class="form-control" rows="12" placeholder="https://example.com/file.zip"></textarea>
    <div class="mt-3 d-flex justify-content-between">
        <button id="loadFileBtn" class="btn btn-outline-primary">Load from file</button>
        <button id="importBtn" class="btn btn-primary">Import URLs</button>
    </div>
    <script src="link-grabber.js"></script>
</body>
</html>
