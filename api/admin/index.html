<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDM Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .login-container, .dashboard {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
        }
        .login-box h1 {
            text-align: center;
            font-size: 24px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #1a1a28;
            border: 1px solid #2a2a40;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: #a855f7; }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
        .btn-approve { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-reject { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-sm { padding: 8px 16px; width: auto; font-size: 13px; }

        /* Dashboard */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e1e30;
        }
        .header h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid #1e1e30;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #a855f7;
        }
        .stat-card .label { font-size: 12px; color: #888; margin-top: 5px; }

        .payment-card {
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid #1e1e30;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .payment-card .info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .payment-card .info-item { font-size: 13px; }
        .payment-card .info-item .label { color: #888; font-size: 11px; }
        .payment-card .info-item .value { color: #fff; font-weight: 500; }
        .payment-card .screenshot {
            max-width: 300px;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid #2a2a40;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .payment-card .actions { display: flex; gap: 10px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-pending { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .badge-approved { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-rejected { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            padding: 8px 20px;
            background: #1a1a28;
            border: 1px solid #2a2a40;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #aaa;
        }
        .tab.active { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: #fff; }
        .empty { text-align: center; padding: 40px; color: #555; }
        .toast {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 24px; border-radius: 8px;
            background: rgba(34, 197, 94, 0.9); color: #fff;
            font-size: 14px; display: none; z-index: 999;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="login-page">
        <div class="login-box">
            <h1>🔒 CyberDM Admin</h1>
            <input type="password" id="admin-password" placeholder="Admin Password">
            <button class="btn" onclick="login()">Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard" style="display:none;">
        <div class="header">
            <h1>⚡ CyberDM Admin Panel</h1>
            <button class="btn btn-sm" onclick="logout()" style="background:#1a1a28;border:1px solid #2a2a40;">Logout</button>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="number" id="stat-pending">0</div><div class="label">Pending</div></div>
            <div class="stat-card"><div class="number" id="stat-approved">0</div><div class="label">Approved</div></div>
            <div class="stat-card"><div class="number" id="stat-licenses">0</div><div class="label">Total Licenses</div></div>
            <div class="stat-card"><div class="number" id="stat-pro">0</div><div class="label">Active Pro</div></div>
        </div>

        <div class="tab-bar">
            <div class="tab active" onclick="switchTab('pending')">⏳ Pending</div>
            <div class="tab" onclick="switchTab('approved')">✅ Approved</div>
            <div class="tab" onclick="switchTab('rejected')">❌ Rejected</div>
            <div class="tab" onclick="switchTab('licenses')">🔑 Licenses</div>
        </div>

        <div id="content"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '../';  // Relative to admin folder
        let adminKey = '';
        let currentTab = 'pending';

        function login() {
            const pass = document.getElementById('admin-password').value;
            adminKey = pass;
            // Simple client-side check, real auth is server-side
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadDashboard();
        }

        function logout() {
            adminKey = '';
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
        }

        async function api(endpoint, data = {}) {
            const res = await fetch(API_BASE + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...data, admin_key: adminKey })
            });
            return res.json();
        }

        async function loadDashboard() {
            // Load payments
            const res = await fetch(API_BASE + 'admin_list.php?admin_key=' + adminKey);
            const data = await res.json();

            if (data.error) {
                showToast('Error: ' + data.error, true);
                return;
            }

            document.getElementById('stat-pending').textContent = data.stats?.pending || 0;
            document.getElementById('stat-approved').textContent = data.stats?.approved || 0;
            document.getElementById('stat-licenses').textContent = data.stats?.total_licenses || 0;
            document.getElementById('stat-pro').textContent = data.stats?.active_pro || 0;

            window.dashboardData = data;
            renderTab();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderTab();
        }

        function renderTab() {
            const content = document.getElementById('content');
            const data = window.dashboardData;
            if (!data) return;

            if (currentTab === 'licenses') {
                const licenses = data.licenses || [];
                if (licenses.length === 0) {
                    content.innerHTML = '<div class="empty">No licenses found</div>';
                    return;
                }
                content.innerHTML = licenses.map(l => `
                    <div class="payment-card">
                        <div class="info">
                            <div class="info-item"><div class="label">License Key</div><div class="value">${l.license_key}</div></div>
                            <div class="info-item"><div class="label">Plan</div><div class="value"><span class="badge ${l.plan === 'pro' ? 'badge-approved' : 'badge-pending'}">${l.plan.toUpperCase()}</span></div></div>
                            <div class="info-item"><div class="label">Status</div><div class="value">${l.status}</div></div>
                            <div class="info-item"><div class="label">Expiry</div><div class="value">${l.expiry_date || 'N/A'}</div></div>
                            <div class="info-item"><div class="label">HWID</div><div class="value">${l.hwid || 'Not bound'}</div></div>
                            <div class="info-item"><div class="label">Created</div><div class="value">${l.created_at}</div></div>
                        </div>
                    </div>
                `).join('');
                return;
            }

            const payments = (data.payments || []).filter(p => p.status === currentTab);

            if (payments.length === 0) {
                content.innerHTML = `<div class="empty">No ${currentTab} payments</div>`;
                return;
            }

            content.innerHTML = payments.map(p => `
                <div class="payment-card" id="payment-${p.id}">
                    <div class="info">
                        <div class="info-item"><div class="label">Method</div><div class="value">${p.method.toUpperCase()}</div></div>
                        <div class="info-item"><div class="label">Amount</div><div class="value">${p.amount}</div></div>
                        <div class="info-item"><div class="label">Transaction ID</div><div class="value">${p.trx_id}</div></div>
                        <div class="info-item"><div class="label">License Key</div><div class="value">${p.license_key}</div></div>
                        <div class="info-item"><div class="label">Date</div><div class="value">${p.created_at}</div></div>
                        <div class="info-item"><div class="label">Status</div><div class="value"><span class="badge badge-${p.status}">${p.status.toUpperCase()}</span></div></div>
                    </div>
                    ${p.screenshot_path ? `<img src="${API_BASE}${p.screenshot_path}" class="screenshot" onclick="window.open(this.src)">` : ''}
                    ${p.status === 'pending' ? `
                        <div class="actions">
                            <button class="btn btn-sm btn-approve" onclick="approvePayment(${p.id})">✅ Approve</button>
                            <button class="btn btn-sm btn-reject" onclick="rejectPayment(${p.id})">❌ Reject</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function approvePayment(id) {
            if (!confirm('Approve this payment and activate license for 30 days?')) return;
            const result = await api('admin_approve.php', { payment_id: id });
            if (result.success) {
                showToast('✅ Payment approved! License: ' + result.license_key);
                loadDashboard();
            } else {
                showToast('Error: ' + result.error, true);
            }
        }

        async function rejectPayment(id) {
            const reason = prompt('Rejection reason (optional):') || '';
            const result = await api('admin_reject.php', { payment_id: id, reason });
            if (result.success) {
                showToast('Payment rejected');
                loadDashboard();
            } else {
                showToast('Error: ' + result.error, true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? 'rgba(239,68,68,0.9)' : 'rgba(34,197,94,0.9)';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
